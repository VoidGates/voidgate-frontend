name: PR Guard

# pull_request_target runs the workflow and scanner from main, so a PR can't
# edit the guard to pass itself. The PR's code is only read as a diff, never run.
# merge_group re-scans the combined diff in the merge queue (PRs already approved).
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan PR diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          if [ -z "$PR" ]; then
            HEAD="$HEAD_SHA"
          else
            git fetch --no-tags origin "refs/pull/$PR/head"
            HEAD=FETCH_HEAD
          fi
          set +e
          git diff --unified=0 --no-color "$BASE...$HEAD" | node .github/scripts/pr-guard.mjs > report.md
          status=$?
          set -e
          cat report.md
          if [ -n "$PR" ]; then
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --edit-last --create-if-none --body-file report.md
          fi
          exit $status
