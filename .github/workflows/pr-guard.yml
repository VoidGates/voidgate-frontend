name: PR Guard

# pull_request_target runs the workflow and scanner from main, so a PR can't
# edit the guard to pass itself. The PR's code is only read as a diff, never run.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan PR diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "refs/pull/$PR/head"
          set +e
          git diff --unified=0 --no-color "$BASE...FETCH_HEAD" | node .github/scripts/pr-guard.mjs > report.md
          status=$?
          set -e
          cat report.md
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --edit-last --create-if-none --body-file report.md
          exit $status
